<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="日志、投影与界面三层结构">
  <rect width="720" height="240" fill="#fdfcf9" />
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="52" width="180" height="120" rx="12" fill="#f3efe6" stroke="#d8cfbc" />
    <text x="118" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#22242a">Session log</text>
    <text x="118" y="112" text-anchor="middle" font-size="12" fill="#6d7280">append-only events</text>
    <text x="118" y="134" text-anchor="middle" font-size="12" fill="#6d7280">fork / resume / replay</text>

    <rect x="270" y="52" width="180" height="120" rx="12" fill="#f7f3ea" stroke="#d8cfbc" />
    <text x="360" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#22242a">Projection</text>
    <text x="360" y="112" text-anchor="middle" font-size="12" fill="#6d7280">pure fold, cached</text>
    <text x="360" y="134" text-anchor="middle" font-size="12" fill="#6d7280">same reference = no render</text>

    <rect x="512" y="52" width="180" height="120" rx="12" fill="#f3efe6" stroke="#d8cfbc" />
    <text x="602" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#22242a">Slots</text>
    <text x="602" y="112" text-anchor="middle" font-size="12" fill="#6d7280">sidebar · main panel</text>
    <text x="602" y="134" text-anchor="middle" font-size="12" fill="#6d7280">iframe preview</text>

    <g stroke="#8a5a2b" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)">
      <line x1="212" y1="112" x2="262" y2="112" />
      <line x1="454" y1="112" x2="504" y2="112" />
    </g>
    <path d="M602 176c0 26-40 36-92 36H212c-52 0-92-10-92-36" stroke="#c7b79c" stroke-width="1.4" fill="none" stroke-dasharray="5 5" />
    <text x="360" y="222" text-anchor="middle" font-size="11" fill="#6d7280">界面只读投影，从不回写日志</text>
  </g>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a5a2b" />
    </marker>
  </defs>
</svg>
